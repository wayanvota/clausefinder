name: End-to-end tests

on:
  push:
    branches: [main, "test/e2e-harness-**"]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: clausefinder-playwright-report
          path: |
            playwright-report/
            artifacts/
          retention-days: 7
